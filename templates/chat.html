<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{.RoomName}} | DevChat</title>
    <!-- ?v= は版の番号。番号を変えると、ブラウザは「別のファイル」とみなして必ず読み直す
         （以前の版の CSS を覚えているブラウザでも、新しい CSS が使われるようにするため） -->
    <link rel="stylesheet" href="/static/css/base.css?v=2" />
    <link rel="stylesheet" href="/static/css/chat.css?v=2" />
  </head>

  <body>
    <div class="app">
      <header>
        <!-- 見出し（h1）は「このページは何か」を表すので、戻るリンクとは分けてプロジェクト名を入れる -->
        <a href="/" class="leave-link">← 退室</a>
        <h1 class="room-title" title="{{.RoomName}}">{{.RoomName}}</h1>
        <div class="header-right">
          <span id="online-count">--人</span>
          <form method="POST" action="/logout" class="logout-form">
            <button type="submit">ログアウト</button>
          </form>
        </div>
      </header>

      <div id="messages"></div>
      <p id="typing-indicator"></p>
      <!-- 送信できなかったときの理由を出す場所（role="status" で読み上げソフトにも伝わる） -->
      <p id="composer-notice" role="status"></p>

      <form id="composer">
        <!-- 複数行で書けるよう textarea にする。rows="1" で最初は1行の高さ（入力に合わせて伸びる） -->
        <textarea placeholder="メッセージを入力（Shift+Enter で改行）" id="text" rows="1"></textarea>
        <button type="submit" id="send-btn" aria-label="送信">➤</button>
      </form>
    </div>

    <script>
      // 今開いているページのパス（例: /rooms/3）に "/ws" を足すだけで
      // そのままそのルーム専用のWebSocketエンドポイント（/rooms/3/ws）になる
      var wsScheme = window.location.protocol === "https:" ? "wss://" : "ws://";
      var ws = new WebSocket(wsScheme + window.location.host + window.location.pathname + "/ws");

      // ページ遷移・タブを閉じる・戻る操作など、このページを離れるあらゆる
      // タイミングで明示的にWebSocketを閉じる。
      // ブラウザの「ページ遷移時に接続を自動で閉じてくれる」挙動だけに頼ると、
      // ブラウザや状況によってはすぐに閉じられず、サーバー側の在室人数が
      // 減らないままになることがあるため、ここで確実に閉じておく。
      window.addEventListener("pagehide", function () {
        ws.close();
      });

      // 自分のユーザーID（サーバーから "me" メッセージで受け取って保存する）
      var currentUserID = null;

      // 現在入力中のユーザーを管理するオブジェクト { userID: username, ... }
      // 複数人が同時に入力中でも対応できるようにオブジェクトで管理する
      var typingUsers = {};

      // typingUsersの内容を "alice, bob が入力中..." の形式で表示する
      function updateTypingIndicator() {
        var names = Object.values(typingUsers); // オブジェクトの値（ユーザー名）だけ配列で取り出す
        var indicator = document.getElementById("typing-indicator");
        if (names.length === 0) {
          indicator.innerText = ""; // 誰も入力中でなければ空にする
        } else {
          indicator.innerText = names.join(", ") + " が入力中...";
        }
      }

      // 2秒後に stopTyping を送るタイマー（キー入力のたびにリセットする）
      var typingTimer = null;

      var messagesEl = document.getElementById("messages");

      function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }

      // サーバーから届いた時刻（例：2026-11-24T16:03:42Z。UTC）を、
      // この PC のタイムゾーン（日本なら日本時間）の "2026/11/25 01:03:42" に直す
      function formatTime(iso) {
        var d = new Date(iso);
        if (isNaN(d.getTime())) return iso; // 読めない形式なら、そのまま出す

        function pad(n) {
          return String(n).padStart(2, "0"); // 1桁の数字を "05" のように2桁にする
        }
        return (
          d.getFullYear() + "/" + pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + " " +
          pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds())
        );
      }

      // チャット欄が一番下（最新）まで見えているか。少しの誤差は許す
      function isNearBottom() {
        return messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight < 30;
      }

      // 画面に出ているメッセージの中で一番古い ID（古い履歴を読むときの「ここより前」の目印）
      var oldestID = 0;
      // まだ読んでいない古いメッセージがあるか（サーバーの hasMore）
      var hasMoreHistory = false;
      // 古い履歴を読んでいる途中か（同じ範囲を何度も頼まないように）
      var loadingOlder = false;
      var loadingOlderTimer = null;

      // メッセージ1件分の要素を作る（画面にはまだ入れない）
      // m: サーバーから届いたメッセージ { id, content, userID, username, createdAt }
      function createMessageEl(m) {
        var id = m.id;
        var isMine = m.userID === currentUserID;

        var div = document.createElement("div");
        div.className = "message " + (isMine ? "mine" : "theirs");
        div.setAttribute("data-id", id); // data-id属性にDBのIDを入れておく（削除時に特定するため）

        var meta = document.createElement("div");
        meta.className = "meta";
        meta.innerText = (isMine ? "自分" : m.username) + " ・ " + formatTime(m.createdAt);
        div.appendChild(meta);

        var row = document.createElement("div");
        row.className = "bubble-row";

        var bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.innerText = m.content;
        row.appendChild(bubble);

        // 自分のメッセージにだけ削除ボタンを追加する
        if (isMine) {
          var btn = document.createElement("button");
          btn.className = "delete-btn";
          btn.innerText = "削除";
          btn.onclick = function () {
            // 削除リクエストをJSON形式でサーバーに送る
            ws.send(JSON.stringify({ type: "delete", id: id }));
          };
          row.appendChild(btn);
        }

        div.appendChild(row);
        return div;
      }

      // 同じメッセージがすでに画面にあるか（念のため、二重に表示しないようにする）
      function hasMessage(id) {
        return document.querySelector("[data-id='" + id + "']") !== null;
      }

      // 新しく届いたメッセージを1件、一番下に足す
      function appendMessage(m) {
        if (hasMessage(m.id)) return;
        // 足す前に一番下を見ていたとき、または自分が送ったときだけ下までスクロールする
        // （上の過去ログを読んでいる最中に、他の人の発言で勝手に一番下へ飛ばさない）
        var follow = isNearBottom() || m.userID === currentUserID;
        messagesEl.appendChild(createMessageEl(m));
        if (follow) scrollToBottom();
        if (oldestID === 0) oldestID = m.id;
      }

      // 履歴（古い順に並んだ複数のメッセージ）を、まとめて1つの「入れ物」に作る。
      // DocumentFragment は画面に出ていない入れ物で、最後に1回だけ画面に入れるので、
      // 1件ずつ画面に入れるより描画の回数がずっと少なくて済む
      function buildFragment(messages) {
        var fragment = document.createDocumentFragment();
        messages.forEach(function (m) {
          if (!hasMessage(m.id)) fragment.appendChild(createMessageEl(m));
        });
        return fragment;
      }

      // 履歴を受け取ったあとの共通の処理
      function afterHistory(data) {
        if (data.messages && data.messages.length > 0) {
          oldestID = data.messages[0].id; // 古い順なので、先頭が一番古い
        }
        hasMoreHistory = !!data.hasMore;
        // 履歴が少なくてチャット欄にスクロールバーが出ないと、上にスクロールして読み足せない。
        // その場合は、続けて古い履歴を自動で読む
        if (hasMoreHistory && messagesEl.scrollHeight <= messagesEl.clientHeight) {
          loadOlder();
        }
      }

      // 入室したときの履歴：一番下に入れて、最新が見える位置にする
      function showHistory(data) {
        messagesEl.appendChild(buildFragment(data.messages || []));
        scrollToBottom();
        afterHistory(data);
      }

      // 上にスクロールして読んだ古い履歴：一番上に入れる。
      // 上に足すと中身が伸びて、今見ている位置が下にずれるので、伸びた分だけスクロール位置を戻す
      function showOlderHistory(data) {
        loadingOlder = false;
        clearTimeout(loadingOlderTimer);
        var heightBefore = messagesEl.scrollHeight;
        messagesEl.insertBefore(buildFragment(data.messages || []), messagesEl.firstChild);
        messagesEl.scrollTop += messagesEl.scrollHeight - heightBefore;
        afterHistory(data);
      }

      // もっと古い履歴をサーバーに頼む
      function loadOlder() {
        if (!hasMoreHistory || loadingOlder || oldestID === 0) return;
        loadingOlder = true;
        ws.send(JSON.stringify({ type: "loadOlder", before: oldestID }));
        // 返事が来なかったとき（通信の不調など）に、ずっと「読み込み中」のままにならないよう、
        // 5秒たったらもう一度頼めるようにする
        clearTimeout(loadingOlderTimer);
        loadingOlderTimer = setTimeout(function () {
          loadingOlder = false;
        }, 5000);
      }

      // チャット欄の一番上近くまでスクロールしたら、古い履歴を読む
      messagesEl.addEventListener("scroll", function () {
        if (messagesEl.scrollTop < 80) loadOlder();
      });

      // サーバーからメッセージが届いた時の処理
      ws.onmessage = function (msg) {
        var data = JSON.parse(msg.data);

        if (data.type === "me") {
          // 自分のユーザーIDを受け取って保存する
          // これ以降に届くメッセージの userID と比較して削除ボタンを出すか決める
          currentUserID = data.userID;

        } else if (data.type === "userCount") {
          document.getElementById("online-count").innerText = data.count + "人";

        } else if (data.type === "chat") {
          // メッセージが届いたらその人のタイピング表示を消す（送信完了したから）
          delete typingUsers[data.userID];
          updateTypingIndicator();
          appendMessage(data);

        } else if (data.type === "history") {
          // 入室したときの最新の履歴（まとめて1回で届く）
          showHistory(data);

        } else if (data.type === "olderHistory") {
          // 上にスクロールして頼んだ、古い履歴
          showOlderHistory(data);

        } else if (data.type === "typing") {
          // 自分自身のタイピングは表示しない
          if (data.userID !== currentUserID) {
            typingUsers[data.userID] = data.username; // キーをuserIDにして上書きで管理
            updateTypingIndicator();
          }

        } else if (data.type === "stopTyping") {
          delete typingUsers[data.userID]; // そのユーザーを入力中リストから削除
          updateTypingIndicator();

        } else if (data.type === "delete") {
          // data-id属性が一致するDOM要素を探して削除する
          var el = document.querySelector("[data-id='" + data.id + "']");
          if (el) el.remove();

        } else if (data.type === "error") {
          // サーバーが受け付けなかったときの理由（文字数オーバー、連投など）
          showNotice(data.content);

        } else if (data.type === "roomDeleted") {
          // 作成者がこの部屋を削除した → 全員をホームへ戻す
          alert("この部屋は削除されました");
          ws.close();
          location.href = "/";
        }
      };

      var text = document.getElementById("text");
      var noticeEl = document.getElementById("composer-notice");

      // サーバー（hub.go）と同じルール。ここで先に確認して、送れないときは入力を消さずに残す
      var MAX_MESSAGE_LEN = 2000; // hub.go の maxMessageLen と同じ値にする
      var MIN_SEND_INTERVAL = 500; // hub.go の chatMinInterval と同じ（ミリ秒）
      var lastSentAt = 0;

      // 送信できなかった理由を、入力欄の上に4秒だけ出す
      var noticeTimer = null;
      function showNotice(message) {
        noticeEl.innerText = message;
        clearTimeout(noticeTimer);
        noticeTimer = setTimeout(function () {
          noticeEl.innerText = "";
        }, 4000);
      }

      // 入力欄が伸びる高さの上限（px）。約10行分。それ以上は入力欄の中でスクロールする
      // 1行 18.9px（文字 13.5px × 行の高さ 1.4）× 10行 ＝ 189px ＋ 上下の余白 20px ＋ 枠線 2px ＝ 211px
      // chat.css の #text の max-height と同じ値にする
      var COMPOSER_MAX_HEIGHT = 211;

      // 入力欄の高さを中身に合わせる（上限は COMPOSER_MAX_HEIGHT）
      function resizeComposer() {
        // 伸ばす前に、チャット欄が一番下まで見えていたかを覚えておく
        var wasAtBottom = isNearBottom();

        text.style.height = "auto"; // 一度縮めてから測らないと、文字を消したときに縮まない
        // scrollHeight（中身の高さ）には枠線の上下 1px ずつが入っていないので、2 を足す
        // （足さないと枠線の分だけ足りず、最後の行が少し隠れてスクロールが出る）
        text.style.height = Math.min(text.scrollHeight + 2, COMPOSER_MAX_HEIGHT) + "px";

        // 入力欄が伸びるとチャット欄が縮むので、最新のメッセージが隠れないよう下に合わせ直す
        // （上の過去ログを読んでいる最中なら、勝手に動かさない）
        if (wasAtBottom) scrollToBottom();
      }

      // メッセージを送る（送信ボタンと Enter キーの両方から呼ぶ）
      function sendMessage() {
        var content = text.value;

        // 空白や改行だけなら送らない
        if (content.trim() === "") return;

        // Array.from で1文字ずつに分けて数える（.length だと絵文字を2文字と数えてしまう）
        if (Array.from(content).length > MAX_MESSAGE_LEN) {
          showNotice("メッセージは" + MAX_MESSAGE_LEN + "文字以内にしてください");
          return;
        }

        var now = Date.now();
        if (now - lastSentAt < MIN_SEND_INTERVAL) {
          showNotice("送信が速すぎます。少し待ってから送ってください");
          return;
        }
        lastSentAt = now;

        // 送信したら即座に stopTyping → タイマーが残っていてもキャンセル
        clearTimeout(typingTimer);
        ws.send(JSON.stringify({ type: "stopTyping" }));
        ws.send(JSON.stringify({ type: "chat", content: content }));
        text.value = "";
        resizeComposer();
      }

      // Enter で送信、Shift+Enter で改行
      text.addEventListener("keydown", function (e) {
        if (e.key !== "Enter" || e.shiftKey) return; // Shift+Enter はそのまま改行させる

        // 日本語入力で漢字に変換している途中の Enter（変換の確定）では送らない。
        // isComposing は変換中かどうか。keyCode 229 は、一部のブラウザで変換中の Enter に付く値
        if (e.isComposing || e.keyCode === 229) return;

        e.preventDefault(); // textarea に改行が入らないようにする
        sendMessage();
      });

      // inputイベント: テキストが変化するたびに発火（keypress より幅広く検知できる）
      text.addEventListener("input", function () {
        resizeComposer();

        // typing を送信（サーバーが全員に中継する）
        ws.send(JSON.stringify({ type: "typing" }));

        // 既存タイマーをリセットして2秒後に stopTyping を送る
        // キーを打ち続ける限りタイマーは延長され、止まったら2秒後に発火する
        clearTimeout(typingTimer);
        typingTimer = setTimeout(function () {
          ws.send(JSON.stringify({ type: "stopTyping" }));
        }, 2000);
      });

      // 送信ボタン（フォームの submit）
      document.getElementById("composer").addEventListener("submit", function (e) {
        e.preventDefault(); // ページを読み込み直さないようにする
        sendMessage();
      });
    </script>
  </body>
</html>
