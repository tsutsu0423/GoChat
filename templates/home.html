<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>プロジェクト一覧 | DevChat</title>
    <link rel="stylesheet" href="/static/css/chat.css" />
    <link rel="stylesheet" href="/static/css/home.css" />
  </head>

  <body>
    <div class="app home">
      <header>
        <h1>プロジェクト一覧</h1>
        <div class="header-right">
          <a href="/logout">ログアウト</a>
        </div>
      </header>

      <main>
        <form class="create-form" method="POST" action="/rooms">
          <input type="text" name="name" placeholder="新規プロジェクト名" required />
          <button type="submit">＋ 作成</button>
        </form>

        <ul id="room-list"></ul>
        <p id="empty-hint" class="empty-hint" hidden>プロジェクトがありません。上のフォームから作成してください。</p>
      </main>
    </div>

    <script>
      // 部屋一覧をサーバーから取得してDOMに描画する
      function loadRooms() {
        fetch("/rooms")
          .then(function (res) {
            return res.json();
          })
          .then(function (rooms) {
            renderRooms(rooms);
          });
      }

      function renderRooms(rooms) {
        var list = document.getElementById("room-list");
        var emptyHint = document.getElementById("empty-hint");

        list.innerHTML = "";

        if (rooms.length === 0) {
          emptyHint.hidden = false;
          return;
        }
        emptyHint.hidden = true;

        rooms.forEach(function (room) {
          var li = document.createElement("li");
          li.className = "room-row";

          var name = document.createElement("span");
          name.className = "room-name";
          name.innerText = room.name;
          li.appendChild(name);

          var online = document.createElement("span");
          online.className = "room-online";
          online.innerText = room.onlineCount + "人";
          li.appendChild(online);

          var enter = document.createElement("a");
          enter.className = "room-enter";
          enter.href = "/rooms/" + room.id;
          enter.innerText = "入室";
          li.appendChild(enter);

          // 自分が作成した部屋にだけ削除ボタンを出す
          if (room.isOwner) {
            var del = document.createElement("button");
            del.className = "room-delete";
            del.type = "button";
            del.title = "この部屋を削除";
            del.setAttribute("aria-label", "この部屋を削除");
            del.innerHTML =
              '<svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h12M8 6V4.5A1.5 1.5 0 0 1 9.5 3h1A1.5 1.5 0 0 1 12 4.5V6M8.5 9.5v5M11.5 9.5v5M5.5 6l.6 9.2A1.5 1.5 0 0 0 7.6 16.6h4.8a1.5 1.5 0 0 0 1.5-1.4L14.5 6"/></svg>';
            del.onclick = function () {
              deleteRoom(room.id, room.name);
            };
            li.appendChild(del);
          }

          list.appendChild(li);
        });
      }

      // 部屋を削除する（確認ダイアログを出してからDELETEリクエストを送る）
      function deleteRoom(id, name) {
        if (!confirm("「" + name + "」を削除しますか？メッセージも全て削除され、元に戻せません。")) {
          return;
        }
        fetch("/rooms/" + id, { method: "DELETE" }).then(function (res) {
          if (res.ok) {
            loadRooms();
          } else {
            alert("削除に失敗しました");
          }
        });
      }

      loadRooms();
      // 他の人の入退室に合わせて在室人数がだいたい最新になるよう、定期的に再取得する
      setInterval(loadRooms, 5000);
    </script>
  </body>
</html>
